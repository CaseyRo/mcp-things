[project]
name = "mcp-things"
version = "2.1.7"
description = "Production-ready Model Context Protocol server for Things 3, enabling AI assistants to interact with your task management system through natural language"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT License" }
authors = [
    { name = "Yaroslav Krempovych", email = "51231325+excelsior@users.noreply.github.com" },
    { name = "Harald Lindstrøm", email = "hald@users.noreply.github.com" },
]
keywords = [
    "mcp",
    "anthropic",
    "claude",
    "things3",
    "things",
    "task-management",
    "productivity",
    "fastmcp",
    "macos",
    "apple",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: MacOS",
]
dependencies = [
    "httpx>=0.28.1",
    "fastmcp>=3.4.2,<4.0.0",
    "pydantic-settings>=2.12.0",
    "things-py>=1.0.1",
    "rich>=14.0.0",
    "wsproto>=1.2.0",  # WebSocket protocol without deprecation warnings
]

[project.urls]
"Homepage" = "https://github.com/CaseyRo/mcp-things"
"Bug Tracker" = "https://github.com/CaseyRo/mcp-things/issues"
"Documentation" = "https://github.com/CaseyRo/mcp-things#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/things_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/things_mcp",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    "things_fast_server.py",
]

[tool.hatch.envs.default]
dependencies = ["pytest", "pytest-cov", "pytest-asyncio", "ruff", "build", "twine"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "build>=0.10.0",
    "twine>=4.0.0",
]

[project.scripts]
server = "things_mcp.things_fast_server:main"
dev = "things_mcp.things_fast_server:main"

[tool.hatch.envs.default.scripts]
test = "python -m pytest tests"
lint = "ruff check ."
format = "ruff format ."
build = "python -m build"
publish = "twine upload dist/*"
clean = "rm -rf dist build *.egg-info"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
    "jsonschema>=4.26.0",  # Used by tests/test_structured_output.py to validate outputSchemas
]
