[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --asyncio-mode=auto -m "not real" --cov=src/things_mcp --cov-fail-under=40
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests (default, CI/CD safe)
    real: marks tests as real integration tests requiring Things 3 (dev only)
